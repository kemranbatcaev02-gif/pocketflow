name: CI & Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        go-version: [ '1.25', '1.26', '1.27' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run Unit & Integration Tests
        run: go test -v ./...

  build-artifacts:
    name: Cross-Platform Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Compile Linux AMD64
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/pocketflow-linux-amd64 ./cmd/pocketflow

      - name: Compile Linux ARM64
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/pocketflow-linux-arm64 ./cmd/pocketflow

      - name: Compile macOS ARM64 (Apple Silicon)
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/pocketflow-darwin-arm64 ./cmd/pocketflow

      - name: Compile Windows AMD64
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/pocketflow-windows-amd64.exe ./cmd/pocketflow

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pocketflow-binaries
          path: dist/*
